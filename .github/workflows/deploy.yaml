name: Deploy application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [alpha, beta, staging, production]
      image_tag:
        description: Published immutable image tag (Git commit SHA)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_REGION: asia-east1
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Read infrastructure outputs and connect to GKE
        working-directory: infra/terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=sre-pretest"
          echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "CLUSTER_REGION=$(terraform output -raw cluster_region)" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=$(terraform output -raw artifact_registry_image)" >> "$GITHUB_ENV"
          echo "CLOUD_ARMOR_POLICY=$(terraform output -raw cloud_armor_policy_name)" >> "$GITHUB_ENV"

      - name: Deploy selected environment
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          gcloud container clusters get-credentials "$CLUSTER_NAME" --region "$CLUSTER_REGION" --project "$GCP_PROJECT_ID"
          gcloud artifacts docker images describe "${IMAGE_REPOSITORY}:${IMAGE_TAG}" >/dev/null
          helm upgrade --install sre-web deploy/chart \
            --namespace "sre-${TARGET_ENVIRONMENT}" --create-namespace \
            --values "deploy/chart/values-${TARGET_ENVIRONMENT}.yaml" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set-string cloudArmor.policyName="$CLOUD_ARMOR_POLICY" \
            --wait --timeout 5m
