replicaCount: 1

image:
  repository: nginx
  tag: stable-alpine
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: false

cloudArmor:
  enabled: false
  policyName: sre-pretest-cloud-armor
  backendConfigName: sre-web-backend

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 250m
    memory: 512Mi
