apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.cloudArmor.enabled }}
  annotations:
    cloud.google.com/backend-config: {{ dict "default" .Values.cloudArmor.backendConfigName | toJson | quote }}
    cloud.google.com/neg: '{"ingress": true}'
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
